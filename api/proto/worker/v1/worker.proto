syntax = "proto3";

package worker.v1;

option go_package = "github.com/bytelisa/distributed-random-forest/api/proto/worker/v1;workerv1";

enum TaskType {
  UNSPECIFIED_TASK = 0;
  CLASSIFICATION_TASK = 1;
  REGRESSION_TASK = 2;
}


// EXPORTED SERVICES

service Worker {
  // Start training a subset of trees
  rpc Train (TrainRequest) returns (TrainResponse);

  // Inference on given input
  rpc Predict (PredictRequest) returns (PredictResponse);

  // Health check for fault tolerance
  rpc Health (HealthRequest) returns (HealthResponse);
}


// MESSAGES

message TrainRequest {
  string model_id = 1;

  // this url will redirect each worker to a specific partition of the dataset
  string dataset_url = 2;

  TaskType task_type = 3;

  // RandomForest hyperparameters
  int32 n_estimators = 4;
  reserved 5;

  string target_column = 6;

  // Necessary for uncorrelated forests
  int32 random_seed = 7;

  // NEW: Fields for deterministic dataset partitioning
  int32 worker_index = 8;
  int32 total_workers = 9;

  // Additional RandomForest hyperparameters (max_depth, max_features,
  // min_samples_split, min_samples_leaf, bootstrap, max_samples, criterion,
  // max_leaf_nodes, class_weight, oob_score), validated and converted to
  // strings by the master (internal/api) before being sent here. The
  // worker converts each value back to the right Python type generically
  // and forwards them as kwargs to scikit-learn.
  map<string, string> hyperparameters = 10;
}

message TrainResponse {
  bool success = 1;
  string message = 2;
}

message PredictRequest {
  string model_id = 1;
  repeated float features = 2;

  // fields necessary to partition trained trees between the workers
  int32 worker_index = 3;  // Indice del worker (0, 1, 2...)
  int32 total_workers = 4; // Totale worker attivi
}

message PredictResponse {
  // Changed from single string to repeated to allow master-side global aggregation
  repeated string predictions = 1;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
}