# configs/config.yaml

# CONFIGURATION FILE

app:
  env: "dev"

server:
  port: 8080

workers:
  grpc_max_threads: 10    # Python ThreadPoolExecutor size
  addresses:
    - "localhost:50051"   # Worker 1
    - "localhost:50052"   # Worker 2
    - "localhost:50053"   # Worker 3
    - "localhost:50054"   # Worker 4 - stopped by default, see scalability.worker_control below
    - "localhost:50055"   # Worker 5
    - "localhost:50056"   # Worker 6
    - "localhost:50057"   # Worker 7
    - "localhost:50058"   # Worker 8

storage:
  type: "s3"
  endpoint: "http://localhost:9000"     # URL MinIO/AWS (TEMPORARY)
  access_key: "minioadmin"              # Credentials
  secret_key: "minioadmin"
  bucket: "example-storage"             # Name of the shared storage
  local_temp_dir: "worker_temp_data"    # Temp dir for workers (each Worker is identified using its port)
  base_path_prefix: "models/"           # S3 folder prefix

# Timeouts & Limits
system:
  timeout_training_seconds: 60
  timeout_prediction_seconds: 5
  timeout_health_check_seconds: 2
  default_n_estimators: 100       # Used when a /train request omits n_estimators
  max_retries_per_tree: 10        # Reassignments of a single tree after worker failures
  retry_backoff_seconds: 3        # Wait between health checks while no worker is healthy

# Hyperparameters applied by both the workers and the baseline when a
# request doesn't specify them (a lone DecisionTree has different defaults
# from a RandomForest). Values are passed to scikit-learn as they are:
# max_features accepts "sqrt", "log2", an int, or a fraction of the features.
model_defaults:
  classification:
    max_features: "sqrt"
    criterion: "entropy"
  regression:
    max_features: 0.3333          # about a third of the features
    criterion: "squared_error"

# Performance evaluation (scripts/benchmark.py, scripts/baseline.py).
# Benchmark uses the same two request files for both models: edit those to change
# dataset, task, n_estimators or hyperparameters for the whole comparison.
# dataset_url in train_request is the source dataset: the benchmark splits it
# into <name>_train.csv / <name>_test.csv first, and trains both models on
# the train part.
evaluation:
  master_url: "http://localhost:8080"
  runs: 100                       # train+predict cycles per model
  train_request: "train_request.json"
  predict_request: "predict_request.json"
  test_size: 0.2                  # fraction of the source dataset held out for test
  split_seed: 42                  # shuffle/split randomness, fixed for reproducibility
  poll_interval_seconds: 0.05     # GET /models/{id} cadence while waiting for "ready"
  output_dir: "performance/evaluation"   # per-dataset files: evaluation_results_<name>.csv / accuracy_results_<name>.csv

# Scalability analysis (scripts/scalability.py). Requires synthetic_<size>.csv
# already on S3 for each size below (classification). n_estimators is fixed on
# purpose: only the worker count varies, across worker_counts, automatically -
# the script itself starts/stops docker compose worker services between
# configurations (worker_control below), no manual steps needed. runs is lower
# than evaluation.runs on purpose: it multiplies by dataset sizes AND worker
# counts (3 x 4 = 12 configurations here). This config targets the Docker
# Compose stack (docker compose must be run from the repo root), regardless of
# config.yaml being the "native execution" file for the master itself.
scalability:
  n_estimators: 100
  dataset_sizes: ["10k", "20k", "50k"]
  target_column: "target"
  runs: 10
  output_dir: "performance/scalability"   # separate from evaluation.output_dir, so plotting scripts can tell the two apart
  worker_counts: [1, 2, 4, 8]
  worker_control:
    backend: "docker"
    docker_service_prefix: "worker-"
    total_slots: 8
    settle_seconds: 5

# Synthetic dataset generation (scripts/synthetic.py), consumed by the
# scalability study above (n_samples for each size come from
# scalability.dataset_sizes, not repeated here, so the two can't diverge).
# Column layout mirrors SDSS: redshift and two photometric bands are
# informative (redshift is the strongest astrophysical signal separating
# quasars from stars/galaxies; band luminosity carries real signal too),
# the remaining three bands are redundant with those (adjacent-wavelength
# photometry is strongly correlated), and sky position (ra, dec) is pure
# noise - there's no physical reason an object's type depends on where it
# is in the sky. len(informative)+len(redundant)+len(noise) must equal
# n_features.
synthetic:
  seed: 42
  n_features: 8
  n_informative: 3
  n_redundant: 3
  n_classes: 3
  class_sep: 1.0          # sklearn default: no reason to deviate, scalability.py only times train/predict, it never scores accuracy
  columns:
    informative: ["redshift", "u", "g"]
    redundant: ["r", "i", "z"]
    noise: ["ra", "dec"]