# configs/config.aws.yaml
#
# Config per il deploy su AWS (EC2 + S3 al posto di MinIO).


app:
  env: "aws"

server:
  port: 8080

workers:
  grpc_max_threads: 10
  addresses:
    # IP PRIVATI delle istanze worker EC2 (stessa VPC del master), non pubblici.
    # Un indirizzo per ogni istanza worker da provisionare
    - "172.31.25.45:50051"    # Worker 1
    - "172.31.30.123:50051"   # Worker 2

storage:
  type: "s3"
  endpoint: "https://s3.us-east-1.amazonaws.com"
  access_key: ""
  secret_key: ""
  bucket: "distributed-rf-demo-bucket"
  local_temp_dir: "worker_temp_data"
  base_path_prefix: "models/"

# Timeouts & Limits
# Valori più larghi di quelli locali/docker: training reale su EC2, con
# dataset più grandi e trasferimenti verso S3 reale, richiede più tempo
# dei test rapidi su iris/housing. Da ricalibrare in base ai task scelti.
system:
  timeout_training_seconds: 600
  timeout_prediction_seconds: 15
  timeout_health_check_seconds: 3
  default_n_estimators: 100       # Used when a /train request omits n_estimators
  max_retries_per_tree: 10        # Reassignments of a single tree after worker failures
  retry_backoff_seconds: 3        # Wait between health checks while no worker is healthy

# Hyperparameters applied by both the workers and the baseline when a
# request doesn't specify them. Values are passed to scikit-learn as they are:
# max_features accepts "sqrt", "log2", an int, or a fraction of the features.
model_defaults:
  classification:
    max_features: "sqrt"
    criterion: "entropy"
  regression:
    max_features: 0.3333          # about a third of the features, chosen as it was suggested by prof. during class :P
    criterion: "squared_error"

# Performance evaluation (scripts/benchmark.py, scripts/baseline.py).
# Benchmark uses the same two request files for both models: edit those to change
# dataset, task, n_estimators or hyperparameters for the whole comparison.
# dataset_url in train_request is the source dataset: the benchmark splits it
# into <name>_train.csv / <name>_test.csv first, and trains both models on
# the train part.
evaluation:
  master_url: "http://<ALB-DNS-NAME>"   # Application Load Balancer in front of the master
  runs: 100                       # train+predict cycles per model
  train_request: "train_request.json"
  predict_request: "predict_request.json"
  test_size: 0.2                  # fraction of the source dataset held out for test
  split_seed: 42                  # shuffle/split randomness, fixed for reproducibility
  poll_interval_seconds: 0.05     # GET /models/{id} cadence while waiting for "ready"
  output_dir: "performance/evaluation"   # per-dataset files: evaluation_results_<name>.csv / accuracy_results_<name>.csv

# Scalability analysis (scripts/scalability.py). Requires synthetic_<size>.csv
# already on S3 for each size below (classification). n_estimators is fixed on
# purpose: only the worker count varies, across worker_counts, automatically -
# the script starts/stops the EC2 worker INSTANCES themselves (not just the
# process on them) via boto3, using instance_ids below (same order as
# workers.addresses above - index 0 is worker 1, etc). NOT VERIFIED END TO END YET
# worker_counts and instance_ids below are placeholders: fill in with number of instances to
# provision (may be fewer than 8 depending on budget). settle_seconds is much larger than the docker config: EC2
# instances take real time to boot and start the worker process, a plain
# "instance running" state isn't the same as "worker ready".
scalability:
  n_estimators: 100
  dataset_sizes: ["10k", "20k", "50k"]
  target_column: "target"
  runs: 10
  output_dir: "performance/scalability"   # separate from evaluation.output_dir, so plotting scripts can tell the two apart
  worker_counts: [1, 2]   # placeholder - adjust to however many instances you provision
  worker_control:
    backend: "aws_ec2"
    region: "us-east-1"
    instance_ids:
      - "i-REPLACE_ME_WORKER_1"
      - "i-REPLACE_ME_WORKER_2"
    settle_seconds: 90

# Synthetic dataset generation (scripts/synthetic.py), consumed by the
# scalability study above (n_samples for each size come from
# scalability.dataset_sizes, not repeated here, so the two can't diverge).
# Column layout mirrors SDSS: redshift and two photometric bands are
# informative (redshift is the strongest astrophysical signal separating
# quasars from stars/galaxies; band luminosity carries real signal too),
# the remaining three bands are redundant with those (adjacent-wavelength
# photometry is strongly correlated), and sky position (ra, dec) is pure
# noise - there's no physical reason an object's type depends on where it
# is in the sky. len(informative)+len(redundant)+len(noise) must equal
# n_features.
synthetic:
  seed: 42
  n_features: 8
  n_informative: 3
  n_redundant: 3
  n_classes: 3
  class_sep: 1.0          # sklearn default: no reason to deviate, scalability.py only times train/predict, it never scores accuracy
  columns:
    informative: ["redshift", "u", "g"]
    redundant: ["r", "i", "z"]
    noise: ["ra", "dec"]

# OOB/accuracy vs n_estimators (scripts/validation_curve.py).
validation_curve:
  train_request: "train_request.json"
  n_estimators_values: [10, 30, 50, 100, 150, 200]
  test_sample_size: 300   # caps live /predict rows per sweep point, full test set is too slow x6

# Runs everything unattended (scripts/run_pipeline.py).
pipeline:
  run_scalability: true
  run_validation_curve: true
  tasks:
    - "train_request.json"
    - "train_request_housing.json"
